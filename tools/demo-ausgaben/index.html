<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Demo: Ausgaben</title>
  <link rel="stylesheet" href="../../core/ui-components.css">
</head>
<body>
  <main class="ow-container">
    <p><a href="../../hub/">← Hub</a></p>
    <h1>💸 Demo: Ausgaben</h1>
    <div id="privacy"></div>
    <section class="ow-card" style="margin-top:1rem">
      <h2 class="ow-card__title">Ausgaben <span id="premium"></span></h2>
      <p class="ow-muted">Gratis: bis zu 3 Einträge. Premium: unbegrenzt.</p>
      <form id="form" class="ow-field" style="flex-direction:row">
        <input class="ow-input" id="text" placeholder="Ausgabe (z. B. Kaffee 4.50)" required aria-label="Ausgabe (z. B. Kaffee 4.50)">
        <button class="ow-btn">Hinzufügen</button>
      </form>
      <p class="ow-error" id="error"></p>
      <ul id="list"></ul>
      <p id="actions"></p>
    </section>
  </main>
  <script type="module" src="src/app.js"></script>
</body>
</html>
