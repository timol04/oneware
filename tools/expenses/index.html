<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eef0ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121416" media="(prefers-color-scheme: dark)">
  <title>Expenses – oneware</title>
  <meta name="description" content="Record income and expenses, sort them into categories and see where your money goes each month. Stored in your browser, no account.">
  <meta property="og:title" content="Expenses – oneware">
  <meta property="og:description" content="Record income and expenses, sort them into categories and see where your money goes each month. Stored in your browser, no account.">
  <meta property="og:image" content="https://timol04.github.io/oneware/core/og.png">
  <link rel="icon" type="image/svg+xml" href="../../core/favicon.svg">
  <script src="../../core/theme-init.js"></script>
  <link rel="preload" href="../../core/fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../../core/ui-components.css">
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <main id="main" class="ow-container ow-container--wide">
    <div class="ex">
      <section class="ow-card ow-workspace ex-sum" aria-labelledby="h-sum">
        <div class="ex-sum__bar">
          <div class="ex-month" role="group" data-i18n-attr="aria-label:ex.month">
            <button type="button" id="prev" class="ow-iconbtn"></button>
            <h2 id="h-sum" class="ex-month__name" aria-live="polite"></h2>
            <button type="button" id="next" class="ow-iconbtn"></button>
          </div>
          <label class="ex-cur">
            <span class="ow-sr-only" data-i18n="ex.currency">Currency</span>
            <select id="currency" class="ow-select"></select>
          </label>
          <button type="button" id="add" class="ow-btn"></button>
        </div>
        <dl class="ex-stats" id="stats"></dl>
      </section>

      <div class="ex-grid">
        <section class="ow-card ow-workspace ex-listcard" aria-labelledby="h-list">
          <h2 class="ow-sr-only" id="h-list" data-i18n="ex.list">Bookings</h2>
          <div class="ex-tools">
            <div id="views" class="ex-chips" role="group" data-i18n-attr="aria-label:ex.views"></div>
            <input id="search" class="ow-input" type="search" autocomplete="off" data-i18n-attr="placeholder:ex.search;aria-label:ex.search">
          </div>
          <div id="list"></div>
          <p id="empty" class="ex-empty ow-muted" hidden></p>
        </section>

        <div class="ex-side">
          <section class="ow-card ow-workspace ex-cats" aria-labelledby="h-cats">
            <h2 id="h-cats" class="ex-h" data-i18n="ex.categories">Categories</h2>
            <div id="cats-body"></div>
          </section>
          <section class="ow-card ow-workspace ex-analysis" id="analysis" aria-labelledby="h-analysis">
            <h2 id="h-analysis" class="ex-h" data-premium-badge><span data-i18n="ex.analysis">Statistics</span></h2>
            <div id="analysis-body"></div>
          </section>
        </div>
      </div>
    </div>
  </main>

  <dialog id="sheet" class="ow-dialog ex-sheet" aria-labelledby="sheet-title">
    <form id="form" novalidate>
      <div class="ex-sheet__head">
        <h2 id="sheet-title"></h2>
        <button type="button" id="close" class="ow-iconbtn"></button>
      </div>
      <div id="f-type" class="ex-types" role="group" data-i18n-attr="aria-label:ex.form.type"></div>
      <div class="ex-two">
        <div class="ow-field">
          <label class="ow-label" for="f-amount" data-i18n="ex.form.amount">Amount</label>
          <input id="f-amount" class="ow-input" inputmode="decimal" autocomplete="off">
          <span class="ow-error" id="e-amount" hidden></span>
        </div>
        <div class="ow-field">
          <label class="ow-label" for="f-date" data-i18n="ex.form.date">Date</label>
          <input id="f-date" class="ow-input" type="date">
          <span class="ow-error" id="e-date" hidden></span>
        </div>
      </div>
      <div class="ow-field">
        <label class="ow-label" for="f-cat" data-i18n="ex.form.category">Category</label>
        <select id="f-cat" class="ow-select"></select>
      </div>
      <div class="ow-field">
        <label class="ow-label" for="f-note" data-i18n="ex.form.note">Note</label>
        <input id="f-note" class="ow-input" maxlength="120" autocomplete="off" data-i18n-attr="placeholder:ex.form.notePh">
      </div>
      <div class="ow-dialog__actions">
        <button type="button" id="delete" class="ow-btn ow-btn--secondary ex-delete" hidden></button>
        <button type="submit" class="ow-btn" data-i18n="ex.form.save">Save</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="src/app.js"></script>
</body>
</html>
