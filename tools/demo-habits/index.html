<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eef0ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121416" media="(prefers-color-scheme: dark)">
  <title>Demo: Habit tracker – oneware</title>
  <meta name="description" content="Follow your habits over time.">
  <meta property="og:title" content="Demo: Habit tracker – oneware">
  <meta property="og:description" content="Demo tool: shows license, storage and UI of the core library.">
  <meta property="og:image" content="https://timol04.github.io/oneware/core/og.png">
  <link rel="icon" type="image/svg+xml" href="../../core/favicon.svg">
  <script src="../../core/theme-init.js"></script>
  <link rel="preload" href="../../core/fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../../core/ui-components.css">
</head>
<body>
  <main id="main" class="ow-container ow-container--tool">
    <section class="ow-card ow-workspace">
      <h2 class="ow-card__title" data-i18n="tool.heading">Habits</h2>
      <form id="form" class="ow-row">
        <input class="ow-input" id="text" data-i18n-attr="placeholder:tool.placeholder;aria-label:tool.placeholder" required>
        <button class="ow-btn" data-i18n="demo.add">Add</button>
      </form>
      <ul id="list" class="ow-list"></ul>
    </section>
  </main>
  <script type="module" src="src/app.js"></script>
</body>
</html>
