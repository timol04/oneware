<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eef0ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121416" media="(prefers-color-scheme: dark)">
  <title data-i18n="dash.title">My Dashboard – Oneware</title>
  <meta name="description" content="Your Oneware tools on this device: license, entries and backups at a glance.">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="../core/favicon.svg">
  <script src="../core/theme-init.js"></script>
  <link rel="preload" href="../core/fonts/bricolage-grotesque.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../core/ui-components.css">
  <link rel="stylesheet" href="../hub/src/hub.css">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <main id="main" class="ow-container">
    <h1 class="ow-page-title" data-i18n="dash.h1">My Dashboard</h1>
    <p class="ow-muted dash__intro" data-i18n="dash.intro">Your tools, all in one place. Read from your browser, stored on your device.</p>
    <p class="dash__trust"><span data-icon="lock" data-icon-size="1rem"></span><span data-i18n="dash.trust">Stored locally · No account · No subscription</span></p>
    <section aria-labelledby="dash-tools-h" class="dash__section">
      <h2 id="dash-tools-h" data-i18n="dash.tools">Your tools</h2>
      <ul id="dash-tools" class="catalog" aria-live="polite"></ul>
    </section>
    <section aria-labelledby="dash-data-h" class="dash__section">
      <h2 id="dash-data-h" data-i18n="dash.data">Data and backup</h2>
      <p class="ow-muted" data-i18n="dash.dataIntro">Back up, restore or link each tool to your own cloud folder.</p>
      <ul id="dash-data" class="dash"></ul>
    </section>
  </main>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
